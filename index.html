<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRE 2.0｜Mellow Economics｜经济节律模型</title>
  <meta name="description" content="QRE 2.0 / Qualia-Rhythm Economy Model / 经济节律模型 by Wei Jueran / Mellow Wei. A rhythm-based economic decision system for value visibility, capital consensus, price formation, overheating, and phase failure." />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Serif+SC:wght@400;500;600;700;900&family=DM+Mono:wght@300;400;500&display=swap');

    :root {
      --bg: #05070b;
      --bg2: #07110f;
      --panel: rgba(10, 18, 24, 0.72);
      --panel2: rgba(12, 31, 29, 0.62);
      --panel3: rgba(29, 16, 34, 0.58);
      --line: rgba(168, 255, 217, 0.18);
      --line2: rgba(255, 167, 205, 0.17);
      --text: #edfdf7;
      --muted: #a8bdb7;
      --soft: #d6fff1;
      --green: #58ffc2;
      --green2: #9effdf;
      --pink: #ff7ab8;
      --rose: #ffd1e5;
      --gold: #ffd978;
      --blue: #79b7ff;
      --red: #ff6868;
      --shadow: 0 26px 90px rgba(0,0,0,0.48);
      --radius: 28px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, rgba(88,255,194,0.22), transparent 32%),
        radial-gradient(circle at 86% 14%, rgba(255,122,184,0.22), transparent 30%),
        radial-gradient(circle at 48% 72%, rgba(121,183,255,0.12), transparent 38%),
        linear-gradient(135deg, #030407 0%, #06110f 45%, #080611 100%);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.18));
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 20% 30%, rgba(88,255,194,0.055) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 20%, rgba(255,122,184,0.06) 0 1px, transparent 2px),
        radial-gradient(circle at 45% 72%, rgba(255,217,120,0.055) 0 1px, transparent 2px);
      background-size: 140px 140px, 180px 180px, 230px 230px;
      animation: driftStars 22s linear infinite;
      opacity: 0.8;
    }

    @keyframes driftStars {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-80px, -60px, 0); }
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(var(--max), calc(100% - 36px));
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid rgba(168,255,217,0.13);
      background: rgba(3, 6, 9, 0.76);
      backdrop-filter: blur(22px);
    }

    .nav {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
      letter-spacing: -0.04em;
      min-width: 190px;
    }
    .brand strong {
      font-size: 18px;
      font-weight: 900;
      color: var(--green2);
    }
    .brand span {
      font-family: "DM Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .links a {
      font-size: 12px;
      font-weight: 700;
      color: rgba(237,253,247,0.82);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 9px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.035);
      transition: 0.22s ease;
    }
    .links a:hover {
      transform: translateY(-1px);
      color: #05100c;
      background: linear-gradient(135deg, var(--green), var(--rose));
      border-color: transparent;
    }

    .hero {
      padding: 78px 0 54px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: stretch;
    }

    .hero-main, .hero-card, .section-card, .module, .stage-card, .protocol-card, .template-box, .score-card {
      background: linear-gradient(145deg, rgba(10,18,24,0.78), rgba(12,31,29,0.45));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .hero-main::before, .hero-card::before, .section-card::before, .module::before, .stage-card::before, .protocol-card::before, .template-box::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(circle at 10% 0%, rgba(88,255,194,0.18), transparent 36%), radial-gradient(circle at 90% 15%, rgba(255,122,184,0.14), transparent 34%);
      opacity: 0.8;
    }

    .hero-main { padding: 42px; }
    .hero-card { padding: 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 22px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "DM Mono", monospace;
      color: var(--green2);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(88,255,194,0.08);
      border: 1px solid rgba(88,255,194,0.18);
      position: relative;
      z-index: 1;
    }
